name: site-audit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Playwright + a locally served docs/ copy is retired (decree 2026-09-04):
      # leftover docs/*.html is not the product UI. This job checks the live-app
      # contract in-checkout (what-we-know.html, funding/access/content JSON)
      # and smokes https://openendo.org key routes. No chromium install.
      - name: Product + contract audit
        run: python3 scripts/audit_site.py --artifacts audit-artifacts
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-artifacts
          path: audit-artifacts
          if-no-files-found: ignore
