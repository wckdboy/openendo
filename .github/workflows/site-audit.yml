name: site-audit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install playwright + chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Serve docs/ and run audit
        run: |
          python3 -m http.server 8080 --directory docs >/tmp/httpd.log 2>&1 &
          SRV=$!
          trap "kill $SRV 2>/dev/null" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/index.html >/dev/null 2>&1 && break
            sleep 1
          done
          python3 scripts/audit_site.py --base-url http://127.0.0.1:8080 --artifacts audit-artifacts
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-artifacts
          path: audit-artifacts
          if-no-files-found: ignore
